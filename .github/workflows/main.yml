
name: Extract ZIP and Upload Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          shopt -s dotglob nullglob
          ITEMS=(extracted/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -a "${ITEMS[0]}"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract and upload new project files" || exit 0
          git push

