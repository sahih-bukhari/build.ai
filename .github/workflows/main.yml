
name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP directly into repository
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          TEMP_DIR=$(mktemp -d)

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          mapfile -t ITEMS < <(
            find "$TEMP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '__MACOSX' ! -name '.DS_Store'
          )

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="$TEMP_DIR"
          fi

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__MACOSX' \
            "$SOURCE"/ ./

          rm -rf "$TEMP_DIR"

      - name: Save project files to GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude).github'

          if git diff --cached --quiet; then
            echo "No changes found."
            exit 0
          fi

          git commit -m "Extract project ZIP into repository root"
          git push

