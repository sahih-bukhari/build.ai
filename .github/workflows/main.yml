
name: extract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          import shutil
          from pathlib import Path

          root = Path(".").resolve()
          zips = list(root.glob("*.zip"))

          if not zips:
              raise SystemExit("ERROR: ZIP file not found.")

          if len(zips) > 1:
              raise SystemExit("ERROR: More than one ZIP found. Keep only the required ZIP.")

          zip_file = zips[0]
          temp = root / "_zip_extract_temp"
          temp.mkdir(exist_ok=True)

          print(f"Extracting: {zip_file.name}")

          with zipfile.ZipFile(zip_file) as archive:
              for member in archive.infolist():
                  path = Path(member.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path detected.")

              archive.extractall(temp)

          items = [
              p for p in temp.iterdir()
              if p.name not in ("__MACOSX", ".DS_Store")
          ]

          source = (
              items[0]
              if len(items) == 1 and items[0].is_dir()
              else temp
          )

          for item in list(source.iterdir()):

              # Preserve existing GitHub workflows
              if item.name in (".github", ".git"):
                  print(f"Preserving: {item.name}")
                  continue

              destination = root / item.name

              if destination.exists():
                  if destination.is_dir() and not destination.is_symlink():
                      shutil.rmtree(destination)
                  else:
                      destination.unlink()

              shutil.move(str(item), str(destination))

          shutil.rmtree(temp)
          zip_file.unlink()

          print("ZIP extracted successfully.")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract and update project files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to commit."
          fi
