
name: Replace Old Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old files
        run: |
          # Delete old repository files, preserving GitHub workflow files
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # Copy new files from the upload folder
          cp -a new-files/. .

          # Remove temporary folder
          rm -rf new-files

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace old files with new version" || echo "No changes"
          git push
