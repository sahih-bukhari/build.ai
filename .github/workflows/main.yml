name: Unpack project ZIP

# Manual only: Actions tab -> "Unpack project ZIP" -> Run workflow.
# Finds the ZIP file you name, extracts it into the repository and commits the result.
# Files that already exist are replaced by the ones inside the ZIP; nothing else is deleted.
# Workflow files (.github/workflows) inside the ZIP are NOT copied: GitHub does not allow the default token to change them.
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Name of the ZIP file in the repository (example: persian-ai-builder-v13-merged.zip)'
        required: true
        type: string
      target_dir:
        description: 'Folder to extract into (leave empty for the repository root)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Validate and extract the ZIP
        env:
          ZIP_PATH: ${{ github.event.inputs.zip_path }}
          TARGET_DIR: ${{ github.event.inputs.target_dir }}
        run: |
          set -euo pipefail
          set -f

          case "$ZIP_PATH" in
            /*|*..*|"") echo "The ZIP path must be a relative path inside the repository." >&2; exit 1 ;;
          esac
          case "$ZIP_PATH" in
            *.zip|*.ZIP) ;;
            *) echo "The file must end with .zip" >&2; exit 1 ;;
          esac
          if [ ! -f "$ZIP_PATH" ]; then
            echo "File not found in the repository: $ZIP_PATH" >&2
            echo "Files at the root:"; ls -A
            exit 1
          fi

          case "$TARGET_DIR" in
            /*|*..*) echo "The target folder must be a relative path inside the repository." >&2; exit 1 ;;
          esac
          target="${TARGET_DIR:-.}"
          mkdir -p "$target"

          # Refuse ZIPs with absolute paths or ".." entries (zip-slip).
          if unzip -Z1 "$ZIP_PATH" | grep -E '(^/|(^|/)\.\.(/|$))' >/dev/null; then
            echo "The ZIP contains unsafe paths; refusing to extract." >&2
            exit 1
          fi

          # Extract to a temporary folder first, then copy everything EXCEPT .github/workflows.
          tmp="$(mktemp -d)"
          unzip -q -o "$ZIP_PATH" -d "$tmp"
          (cd "$tmp" && tar --exclude='./.github/workflows' -cf - .) | (cd "$target" && tar -xf -)
          rm -rf "$tmp"
          skipped=$(unzip -Z1 "$ZIP_PATH" | grep -c '^\.github/workflows/' || true)
          echo "Extracted into $target. Skipped $skipped workflow file(s) from .github/workflows."

      - name: Commit and push the extracted files
        env:
          ZIP_PATH: ${{ github.event.inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Run this workflow on a branch (not a tag)." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed: the ZIP content is already in the repository."
            exit 0
          fi
          git commit -m "Unpack ${ZIP_PATH}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Unpacked ${ZIP_PATH} and pushed the commit to ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
