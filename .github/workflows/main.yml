name: Clean repository (delete all project files)

# Manual only: Actions tab -> "Clean repository (delete all project files)" -> Run workflow -> type DELETE.
# It deletes every file in the branch you run it on, except .git and .github (so this workflow and any other workflow stay),
# and then COMMITS and PUSHES the deletion. Git history is kept, so the old project can always be restored from earlier commits.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove ALL project files from this branch'
        required: true
        type: string
      keep:
        description: 'Optional: extra top-level files or folders to keep, separated by spaces (example: README.md docs)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Delete everything except .git, .github and the entries you chose to keep
        env:
          KEEP: ${{ github.event.inputs.keep }}
        run: |
          set -euo pipefail
          set -f   # no wildcard expansion of the text typed in "keep"
          args=(! -name '.git' ! -name '.github')
          for item in $KEEP; do
            case "$item" in
              .|..|*/*|*'*'*|*'?'*|*'['*) echo "Skipping unsafe entry: $item" ;;
              *) args+=(! -name "$item") ;;
            esac
          done
          find . -mindepth 1 -maxdepth 1 "${args[@]}" -exec rm -rf {} +
          echo "Entries left in the working copy:"
          ls -A

      - name: Commit and push the deletion
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Run this workflow on a branch (not a tag)." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete: the branch has no project files."
            exit 0
          fi
          deleted=$(git diff --cached --name-only --diff-filter=D | wc -l)
          git commit -m "Clean repository: remove all project files"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Deleted $deleted files and pushed the commit to ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
